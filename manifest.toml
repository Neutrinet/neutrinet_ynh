#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "neutrinet"
name = "Neutrinet"
description.en = "Auto renewal for the Neutrinet vpn-certificates"
description.fr = "Renouvellement automatique des certificats vpn Neutrinet"

version = "0.4.3~ynh1"

maintainers = ["Neutrinet"]

[upstream]
license = "AGPL-3.0-or-later"
code = "https://gitlab.domainepublic.net/Neutrinet/renew_cert"
fund = "https://wiki.neutrinet.be/fr/administration/banks"

[integration]
yunohost = ">= 11.2"
architectures = "all"
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/neutrinet"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    url = "https://gitlab.domainepublic.net/Neutrinet/renew_cert/-/archive/0.4.3/renew_cert-0.4.3.tar.bz2"
    sha256 = "42d8e2fa0e4f06417c772c259b4c5cdc5cfb6a7feb3d9052dedd57172e6021e9"

    autoupdate.strategy = "latest_gitlab_release"
    autoupdate.asset = "tarball"

    [resources.apt]
    packages = ["python3-openssl", "python3-requests", "python3-arrow"]

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    # See https://github.com/Neutrinet/neutrinet_ynh/pull/6#issuecomment-2060455857 for explanation
    dir = "/opt/neutrinet"

    [resources.permissions]
    main.url = "/"
